[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibetotext"
version = "0.1.0"
description = "Voice-to-text with automatic code context injection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pywhispercpp",
    "sounddevice",
    "numpy",
    "pyperclip",
    "pynput",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
llm = [
    "google-genai",
    "python-dotenv",
]
all = [
    "vibetotext[llm]",
    "vibetotext[dev]",
]

[project.scripts]
vibetotext = "vibetotext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
